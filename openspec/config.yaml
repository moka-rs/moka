schema: spec-driven

context: |
  Language: English.
  Moka is a concurrent in-memory caching library for Rust (a library crate,
  not an application). OpenSpec is opt-in and reserved for large, multi-stage
  changes; routine design decisions are recorded directly in docs/adr/
  (see docs/adr/README.md).
  When archiving a change, first distill the decisions from its design.md
  into a new ADR under docs/adr/.
